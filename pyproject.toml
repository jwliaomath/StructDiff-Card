[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "structdiff-card"
version = "0.3.0"
description = "Local-first multi-chain structure comparison with contact, motion, and spatial difference maps powered by US-align."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Junwen Liao" }]
keywords = ["structural-biology", "protein", "cryo-em", "US-align", "RMSD", "TM-score"]
dependencies = [
  "gemmi>=0.7.3,<0.8",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "plotly>=5.20,<7",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
structdiff = "structdiff_card.cli:main"

[project.urls]
Homepage = "https://jwliaomath.github.io/StructDiff-Card/"
Repository = "https://github.com/jwliaomath/StructDiff-Card"
Issues = "https://github.com/jwliaomath/StructDiff-Card/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/structdiff_card"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
